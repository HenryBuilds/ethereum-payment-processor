services:
  db:
    image: postgres:16-alpine
    container_name: eth-processor-db
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: processor
      POSTGRES_PASSWORD: processor
      POSTGRES_DB: eth_payments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U processor -d eth_payments"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
